# Helpers the Futura dashboard uses. Optional — the dashboard works without them.
#
# Drop this in as a package (`homeassistant: packages: !include_dir_named packages`
# in configuration.yaml, then save this as `packages/futura.yaml`), or create the
# same helper by hand under Settings → Devices & services → Helpers.
#
# Packages are not reloadable, so this needs a Home Assistant restart to appear.

# Which of the four views `custom:futura-schematics-card` draws.
#
# The card matches this state against its variant names case- and
# space-insensitively, so these options are written to be read rather than parsed.
# Keep the spellings if you edit them — the card names the ones it accepts in an
# error on the card itself if it cannot match, so a typo is visible rather than
# silent.
#
# No `initial:`, deliberately: without it the helper restores whatever was last
# chosen across a restart, which is the point of having it.
input_select:
  futura_schematic:
    name: Futura schematic
    icon: mdi:vector-square
    options:
      - Air flow
      - Unit schematic
      - Service schematic
      - Airflow diagram
