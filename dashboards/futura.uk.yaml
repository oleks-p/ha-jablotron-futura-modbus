# Jablotron Futura dashboard -- uk
#
# Generated by tools/localise_dashboard.py from dashboards/futura.yaml. Edit
# that file, or tools/localise_dashboard.py for the wording, and run the tool
# again; the comments explaining each choice live there.
views:
- title: Futura
  path: futura
  icon: mdi:hvac
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:futura-schematics-card
      prefix: sensor.jablotron_futura
      variant: flow
      variant_entity: select.jablotron_futura_schematic
  - type: grid
    cards:
    - type: tile
      entity: select.jablotron_futura_schematic
      name:
        type: entity
      icon: mdi:vector-square
      features:
      - type: select-options
      grid_options:
        columns: full
    - type: custom:futura-control-card
      prefix: sensor.jablotron_futura
  - type: grid
    cards:
    - type: heading
      heading: Установка
      heading_style: subtitle
    - type: tile
      entity: sensor.jablotron_futura_power_consumption
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_heat_recovered
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_air_flow
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_outdoor_temperature
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_supply_fan_speed
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_exhaust_fan_speed
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_supply_fan_output
      name:
        type: entity
    - type: tile
      entity: sensor.jablotron_futura_exhaust_fan_output
      name:
        type: entity
  - type: grid
    cards:
    - type: heading
      heading: Налаштування
      heading_style: subtitle
    - type: tile
      entity: switch.jablotron_futura_schedule
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_radon_protection
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_automatic_bypass
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_additional_heating
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_additional_cooling
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_comfort_temperature_control
      name:
        type: entity
    - type: tile
      entity: select.jablotron_futura_zone_auto_priority
      name:
        type: entity
    - type: tile
      entity: switch.jablotron_futura_kitchen_hood_normally_open
      name:
        type: entity
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.jablotron_futura_fault
        state: 'on'
      card:
        type: entities
        title: Активні несправності
        entities:
        - entity: binary_sensor.jablotron_futura_fault
          name:
            type: entity
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.jablotron_futura_warning
        state: 'on'
      card:
        type: entities
        title: Активні попередження
        entities:
        - entity: binary_sensor.jablotron_futura_warning
          name:
            type: entity
  - type: grid
    cards:
    - type: heading
      heading: Якість повітря
      heading_style: subtitle
    - type: custom:futura-sensor-grid-card
      prefix: sensor.jablotron_futura
      metric: co2
      columns: 3
    - type: custom:futura-sensor-grid-card
      prefix: sensor.jablotron_futura
      metric: temperature
      columns: 3
    - type: custom:futura-sensor-grid-card
      prefix: sensor.jablotron_futura
      metric: humidity
      columns: 3
- title: Тренди
  path: trends
  icon: mdi:chart-line
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Тренди
      heading_style: subtitle
    - type: statistics-graph
      title: Температура повітря
      days_to_show: 2
      period: 5minute
      stat_types:
      - mean
      chart_type: line
      min_y_axis: 0
      max_y_axis: 35
      fit_y_data: true
      entities:
      - entity: sensor.jablotron_futura_outside_air_temperature
        name: Зовнішнє
      - entity: sensor.jablotron_futura_supply_air_temperature
        name: Припливне
      - entity: sensor.jablotron_futura_extract_air_temperature
        name: Витяжне
      - entity: sensor.jablotron_futura_exhaust_air_temperature
        name: Викидне
      - entity: sensor.jablotron_futura_outdoor_temperature
        name: Зовні (NTC)
    - type: statistics-graph
      title: Вологість повітря
      days_to_show: 2
      period: 5minute
      stat_types:
      - mean
      chart_type: line
      min_y_axis: 20
      max_y_axis: 100
      fit_y_data: true
      entities:
      - entity: sensor.jablotron_futura_outside_air_humidity
        name: Зовнішнє
      - entity: sensor.jablotron_futura_supply_air_humidity
        name: Припливне
      - entity: sensor.jablotron_futura_extract_air_humidity
        name: Витяжне
      - entity: sensor.jablotron_futura_exhaust_air_humidity
        name: Викидне
    - type: custom:futura-history-card
      prefix: sensor.jablotron_futura
      metric: co2
      hours_to_show: 48
    - type: custom:futura-history-card
      prefix: sensor.jablotron_futura
      metric: temperature
      hours_to_show: 48
    - type: custom:futura-history-card
      prefix: sensor.jablotron_futura
      metric: humidity
      hours_to_show: 48
    - type: statistics-graph
      title: Потужність і рекуперація
      days_to_show: 2
      period: 5minute
      stat_types:
      - mean
      chart_type: line
      min_y_axis: 0
      max_y_axis: 2000
      fit_y_data: true
      entities:
      - entity: sensor.jablotron_futura_power_consumption
        name: Потужність
      - entity: sensor.jablotron_futura_heat_recovered
        name: Рекуперовано
    - type: statistics-graph
      title: Витрата повітря
      days_to_show: 2
      period: 5minute
      stat_types:
      - mean
      chart_type: line
      min_y_axis: 0
      max_y_axis: 400
      fit_y_data: true
      entities:
      - entity: sensor.jablotron_futura_air_flow
        name: Витрата повітря
    - type: statistics-graph
      title: Потужність вентиляторів
      days_to_show: 2
      period: 5minute
      stat_types:
      - mean
      chart_type: line
      min_y_axis: 0
      max_y_axis: 100
      fit_y_data: true
      entities:
      - entity: sensor.jablotron_futura_supply_fan_output
        name: Приплив %
      - entity: sensor.jablotron_futura_exhaust_fan_output
        name: Витяжка %
