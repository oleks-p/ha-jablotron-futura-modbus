# Lint settings for the integration, its tests and its probe.
#
# The rule set is deliberately narrow: correctness (F, B), import hygiene (I),
# modern syntax (UP) and the simplifications that genuinely read better (SIM).
# Style beyond that is left alone -- this project's conventions live in its
# comments, not in a formatter's opinion.
target-version = "py312"
line-length = 100

[lint]
select = ["F", "I", "UP", "B", "SIM", "ARG"]

ignore = [
  # Home Assistant fixes the signature of almost everything an integration
  # implements -- async_setup_entry(hass, entry, add_entities), turn_on(**kwargs),
  # a coordinator's _async_update_data -- and not every argument is needed by
  # every implementation. 76 of these were reported and none was dead code.
  "ARG001",
  "ARG002",
  "ARG004",
  # `if a: return False` then `return True` reads as a list of guards, which is
  # what the two places flagged actually are: one condition per line, each with
  # its own comment. Collapsing them into a single negated conjunction is shorter
  # and harder to read, and there is nowhere left to put the comments.
  "SIM103",
]

[lint.per-file-ignores]
# Tests name fixtures after what they build and assert on internals on purpose.
"tests/*" = ["ARG001"]
